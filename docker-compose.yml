version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: commuterservice_postgres
    environment:
      POSTGRES_USER: commuterservice
      POSTGRES_PASSWORD: password
      POSTGRES_DB: commuterservice_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
